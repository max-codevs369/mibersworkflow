map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/manifest+json image/svg+xml;

upstream mibers_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 35m;

    include /etc/nginx/snippets/mibers-locations.conf;
}
