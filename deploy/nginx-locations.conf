location /_next/static/ {
    alias /opt/mibers/static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~* ^/[A-Za-z0-9._-]+\.(?:webp|png|jpg|jpeg|ico|svg|woff2)$ {
    root /opt/mibers/app/public;
    access_log off;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri @next;
}

location / {
    proxy_pass http://mibers_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location @next {
    proxy_pass http://mibers_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
